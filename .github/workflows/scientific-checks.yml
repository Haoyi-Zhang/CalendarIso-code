name: Finite scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-scheduling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the three portable constant-column methods separately
        shell: bash
        run: |
          mkdir -p scientific-output
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 40s \
            python -B -m unittest discover -s tests -p test_constant_columns.py -v \
            2>&1 | tee scientific-output/constant-columns.txt
      - name: Reproduce the complete finite protocol from the flat artifact root
        shell: bash
        run: |
          mkdir -p scientific-output
          set -o pipefail
          ulimit -t 600
          ulimit -v 3145728
          timeout --signal=TERM --kill-after=5s 600s \
            python -B reproduce.py --output-dir scientific-output/run \
            2>&1 | tee scientific-output/runner.txt
      - name: Upload raw outputs even after a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-scheduling-raw-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
